:13px;padding:14px 0}.smallLine{color:var(--muted);font-size:12px;margin:6px 0}/* Piccoli fiocchi discreti, senza coprire i testi o le fotografie */
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-30px;color:#e9eee1;opacity:.15;font-size:15px;line-height:1;animation:fallSnow linear infinite;filter:drop-shadow(0 1px 1px #001d0b)}
.flake:nth-child(1){left:8%;font-size:11px;animation-duration:29s;animation-delay:-12s}
.flake:nth-child(2){left:26%;font-size:16px;animation-duration:35s;animation-delay:-25s}
.flake:nth-child(3){left:44%;font-size:10px;animation-duration:27s;animation-delay:-4s}
.flake:nth-child(4){left:64%;font-size:14px;animation-duration:37s;animation-delay:-20s}
.flake:nth-child(5){left:82%;font-size:12px;animation-duration:32s;animation-delay:-17s}
.flake:nth-child(6){left:95%;font-size:10px;animation-duration:39s;animation-delay:-31s}
@keyframes fallSnow{0%{transform:translate3d(0,-5vh,0) rotate(0deg)}50%{transform:translate3d(15px,50vh,0) rotate(75deg)}100%{transform:translate3d(-10px,110vh,0) rotate(150deg)}}

'use strict';
const ITEMS=[{"id":"guinness","group":"beers","name":{"it":"Guinness"},"price":"3,50–6,00","desc":{"it":"La birra più iconica d’Irlanda, forse del mondo. Una stout caratterizzata dal colore scuro, quasi nero, e da una schiuma bianca compatta e cremosa che, insieme al suo gusto amarognolo con note di cacao e di caffè e ad un retrogusto tostato, la rendono una birra unica al mondo.","en":"Ireland’s most iconic beer—and arguably the world’s most famous stout. Deep, almost black in colour, it is crowned with a dense, creamy white head. Rich notes of roasted coffee and dark cocoa give way to a pleasantly bitter finish, creating a truly unmistakable pint.","de":"Irlands berühmtestes Stout. Dunkel im Glas mit cremigem Schaum. Geschmack nach geröstetem Kaffee und Kakao mit angenehmer Bitterkeit im Abgang.","es":"La cerveza más icónica de Irlanda, y probablemente del mundo. De color oscuro, casi negro, con una espuma blanca, densa y cremosa. En boca es amarga, con notas de cacao, café y un final tostado inconfundible."},"tags":["birra","stout","scura","nera","amara","caffe","cacao","tostata","irlanda"],"photo":"guinness","abv":"4,2%"},{"id":"kilkenny-cream","group":"beers","name":{"it":"Kilkenny Cream"},"price":"3,50–6,00","desc":{"it":"L’autentica Red Ale irlandese, prodotta nel birrificio più antico d’Irlanda. Gli aromi ed il gusto colpiscono per la loro intensità, richiamando toffee e caramello al naso, mentre in bocca la composita è accompagnata da avvolgenti sensazioni di nocciola e di malto tostato.","en":"The authentic Irish Red Ale, brewed at Ireland’s oldest brewery. Rich aromas of toffee and caramel immediately stand out, while the palate is smooth and full-bodied, revealing layers of roasted malt and hazelnut that create a perfectly balanced, exceptionally easy-drinking beer.","de":"Irish Red Ale mit Aromen von Toffee und Karamell. Weich im Geschmack mit Noten von geröstetem Malz und Nüssen.","es":"Auténtica red ale irlandesa elaborada en una de las cervecerías más antiguas de Irlanda. En nariz destacan aromas intensos de toffee y caramelo, mientras que en boca es suave, con notas de avellana y malta tostada."},"tags":["birra","rossa","dolce","caramello","toffee","morbida","nocciola","poco amara"],"photo":"kilkenny-cream","abv":"4,3%"},{"id":"kilkenny-strong","group":"beers","name":{"it":"Kilkenny Strong"},"price":"3,50–6,00","desc":{"it":"Una rossa doppio malto di gradazione superiore, prodotta nell’omonima città (precisamente nello stabilimento di Smithwick’s). È caratterizzata da un aroma di toffee, mentre in bocca si percepisce un gusto secco e deciso, con un lieve sentore di nocciola ed una nota finale amara.","en":"A stronger double-malt red ale brewed in the city of Kilkenny at the historic Smithwick’s brewery. Aromas of toasted toffee lead into a dry, full-flavoured palate, where delicate hints of hazelnut and roasted malt are complemented by a pleasantly bitter finish that gives this beer its distinctive character.","de":"Kräftiges Doppelmalz-Red Ale aus Kilkenny. Toffee in der Nase, trocken und vollmundig mit leicht bitterem Abgang.","es":"Una ale roja de doble malta de mayor graduación, producida en la ciudad de Kilkenny. Aromas de toffee en nariz y un sabor seco y decidido en boca, con ligeras notas de avellana y un final amargo."},"tags":["birra","rossa","forte","toffee","nocciola","secca","amara"],"photo":"kilkenny-strong","abv":"6,4%"},{"id":"bulldog-strong-ale","group":"beers","name":{"it":"Bulldog Strong Ale"},"price":"3,50–6,00","desc":{"it":"Nata nel 1947, questa birra è caratterizzata da un gusto deciso che si sviluppa lentamente durante la bevuta. Le note più caratteristiche che emergono alla bocca sono il caramello e la mandorla amara, mentre il malto tostato va a conferire a questa birra il suo carattere deciso.","en":"First brewed in 1947, this strong ale is known for its bold flavour that gradually unfolds with every sip. Rich notes of caramel and bitter almond dominate the palate, while roasted malt adds depth and body, creating a full-flavoured beer with a long, warming finish.","de":"Kräftiges Strong Ale mit intensivem, vollmundigem Geschmack. Noten von Karamell und Mandeln mit leicht balsamischem Charakter.","es":"Cerveza nacida en 1947, de sabor intenso y evolución progresiva durante la degustación. Destacan notas de caramelo y almendra amarga, con una base de malta tostada que le aporta carácter y estructura."},"tags":["birra","forte","caramello","mandorla","tostata","corposa","dolce"],"photo":"bulldog-strong-ale","abv":"7,1%"},{"id":"casamatta-slip","group":"beers","name":{"it":"Casamatta Slip"},"price":"4,00–6,00","desc":{"it":"Prodotta nel birrificio artigianale di Enemonzo, nel nostro Friuli, questa pils è stata pensata con una fase di ammostamento completa che consente alle proteine e agli amidi di degradarsi completamente, rendendola molto beverina. Prodotta con malti Cechi, questa birra è anche non filtrata e senza glutine.","en":"Crafted at the Casa Matta brewery in Enemonzo, Friuli, this unfiltered, gluten-free pilsner is brewed with premium Czech malts and a full mashing process that completely breaks down proteins and starches. The result is an exceptionally crisp, clean and refreshing beer with remarkable drinkability and a pleasantly dry finish.","de":"Craft-Bier aus der Brauerei Casa Matta in Enemonzo (Friaul). Unfiltriertes, glutenfreies Pils mit vollendetem Maischverfahren für ein besonders leichtes und sehr trinkbares Bier.","es":"Cerveza artesanal producida en Friuli. Elaborada con maltas checas y un proceso completo de maceración que garantiza una bebida muy ligera y fácil de tomar. No filtrada y sin gluten."},"tags":["birra","chiara","leggera","facile","fresca","pils","artigianale","friulana","senza glutine","non filtrata"],"photo":"casamatta-slip","abv":"5,0%"},{"id":"guinness-blonde-ipa","group":"beers","name":{"it":"Guinness Blonde IPA"},"price":"3,50–6,00","desc":{"it":"Una birra chiara ad alta fermentazione che unisce la tradizione irlandese di Guinness alla freschezza delle IPA americane. Dal colore dorato intenso, ha un profilo aromatico fruttato e agrumato. Più morbida e bilanciata delle classiche IPA, è la scelta perfetta per chi vuole una birra aromatica ma facile da bere.","en":"A golden, top-fermented beer that combines Guinness’ Irish brewing heritage with the vibrant hop character of American IPAs. Bright fruity and citrus aromas lead into a smooth, well-balanced palate, softer than a traditional IPA, making it the ideal choice for anyone looking for a flavourful, aromatic beer that remains refreshing and easy to drink.","de":"Helles Bier aus dem Hause Guinness, das die irische Brautradition mit moderner Hopfenaromatik verbindet. Frische Zitrusnoten treffen auf eine leichte Malzbasis und einen ausgewogenen, trockenen Abgang.","es":"Una cerveza rubia de alta fermentación que combina la tradición irlandesa de Guinness con el carácter fresco de una IPA americana. Color dorado intenso, aroma frutal y cítrico, más suave y equilibrada que una IPA clásica."},"tags":["birra","chiara","ipa","agrumata","fruttata","morbida","fresca"],"photo":"guinness-blonde-ipa","abv":"5,0%"},{"id":"hop-house-13","group":"beers","name":{"it":"Hop House 13"},"price":"3,50–6,00","desc":{"it":"Prima lager sviluppata e prodotta da Guinness all’interno dei propri stabilimenti, questa birra ad alta fermentazione è caratterizzata da un aroma fruttato con sentori di pesca ed albicocca e da una bevuta rinfrescante, con sottili note di malto e luppolo ma con un finale secco.","en":"The first lager ever developed and brewed by Guinness in its own brewery, Hop House 13 is a refreshing, full-flavoured beer with a distinctly modern character. Delicate aromas of peach and apricot are complemented by subtle notes of malt and hops, leading to a crisp, clean palate and a satisfyingly dry finish.","de":"Guinness Lager, das traditionelle irische Braukunst mit moderner Hopfenstilistik verbindet. Fruchtige Noten von Pfirsich und Aprikose treffen auf eine weiche, ausgewogene Malzbasis und einen angenehm trockenen Abgang.","es":"La primera lager desarrollada por Guinness dentro de sus propias instalaciones. Cerveza de alta fermentación con aroma frutal, con notas de melocotón y albaricoque. En boca es refrescante, con sutiles toques de malta y lúpulo y un final seco."},"tags":["birra","chiara","lager","fruttata","pesca","albicocca","secca","fresca"],"photo":"hop-house-13","abv":"5,0%"},{"id":"maes-pils","group":"beers","name":{"it":"Maes Pils"},"price":"3,00–5,00","desc":{"it":"Questa pils belga è molto legata allo stile nato in Boemia, da cui arriva ancora oggi la maggior parte dei malti utilizzati per produrla. Alla bocca si percepisce l’amaro di una vera pils, ma con un retrogusto molto pulito. Al naso è delicatamente floreale e pervengono note di cereali.","en":"A classic Belgian pilsner inspired by the traditional Bohemian brewing style, still crafted with a large proportion of premium Czech malts. It delivers the clean, refreshing bitterness expected from a true pilsner, balanced by delicate floral aromas and subtle cereal notes that linger pleasantly on the palate.","de":"Belgisches Pils im Bohemian-Stil. Frisch, leicht bitter, mit floralen Aromen und feinen Getreidenoten.","es":"Cerveza pils belga inspirada en el estilo tradicional checo. Utiliza maltas procedentes de Bohemia. En boca presenta un amargor típico de una pils clásica, con un final limpio y seco. En nariz es suave y floral, con notas de cereales."},"tags":["birra","chiara","pils","amara","secca","floreale","leggera"],"photo":"maes-pils","abv":"5,2%"},{"id":"ichnusa-non-filtrata","group":"beers","name":{"it":"Ichnusa Non Filtrata"},"price":"3,00–5,00","desc":{"it":"Velata come una sera d’estate, questa birra si presenta dorata e opalescente, con una schiuma cremosa che accarezza il bicchiere. Al naso sprigiona profumi di cereale, pane fresco e fieno. In bocca è rotonda, morbida, con il gusto pieno del malto e una lieve nota amaricante che chiude il sorso con equilibrio.","en":"Naturally hazy like a Sardinian summer evening, this unfiltered lager pours a golden, slightly cloudy colour beneath a smooth, creamy head. Fresh aromas of cereal, crusty bread and hay lead into a soft, rounded palate where rich malt flavours are balanced by a gentle bitterness, creating a remarkably smooth and well-rounded beer.","de":"Naturtrübes Lagerbier aus Sardinien. Weich, rund und malzig mit leichter Bitternote im Abgang.","es":"Cerveza dorada, turbia y naturalmente sin filtrar. Espuma cremosa y aromas de cereal, pan fresco y heno. En boca es redonda y suave, con cuerpo de malta y un ligero amargor equilibrado."},"tags":["birra","chiara","non filtrata","morbida","malto","poco amara"],"photo":"ichnusa-non-filtrata","abv":"5,0%"},{"id":"messina-cristalli-di-sale","group":"beers","name":{"it":"Messina Cristalli di Sale"},"price":"3,50–6,00","desc":{"it":"L’ingrediente “segreto” di questa birra sono i cristalli di sale della Sicilia, provenienti dalle saline di Trapani, che permettono di esaltarne gli aromi e, particolarmente, di esaltarne le sensazioni fruttate tipiche degli agrumi di Sicilia. È l’unica birra non filtrata della nostra selezione, ed è una lager.","en":"The unique character of this Sicilian lager comes from the addition of sea salt crystals harvested from the historic salt pans of Trapani. They enhance the beer’s delicate aromas and bring out its bright citrus notes, inspired by the flavours of Sicily. Unfiltered and exceptionally refreshing, it offers a smooth, balanced finish.","de":"Sizilianisches Lagerbier mit Meersalz, das die fruchtigen Zitrusaromen verstärkt und für ein besonders frisches Geschmacksprofil sorgt.","es":"Cerveza italiana elaborada con cristales de sal marina de Sicilia, que realzan sus aromas y especialmente las notas frutales cítricas. Sin filtrar, de estilo lager, con un perfil fresco y ligeramente salino."},"tags":["birra","chiara","fresca","agrumata","fruttata","sale","non filtrata"],"photo":"messina-cristalli-di-sale","abv":"5,0%"},{"id":"bulldog-strong-lager","group":"beers","name":{"it":"Bulldog Strong Lager"},"price":"3,50–6,00","desc":{"it":"Prodotta in Scozia, questa birra decisa e corposa è entrata nel mercato italiano alla fine degli anni ‘80. I suoi profumi fruttati non coprono una nota balsamica, che arriva al naso con un sentore di pino mugo. Alla bocca arriva un corpo deciso e rotondo, con sensazioni pseudo-caloriche evidenti.","en":"A bold, double-malt strong lager brewed for those who enjoy full-bodied beers with real character. Brilliant golden in colour, it offers intense aromas where rich malt and delicate hop notes come together in perfect balance. The palate is smooth, rounded and well-structured, finishing with a firm yet elegant bitterness that leaves a lasting impression.","de":"Vollmundiges, starkes Lagerbier mit Malz- und Fruchtnoten. Kräftig im Geschmack mit leicht balsamischem Charakter.","es":"Cerveza producida en Escocia, de carácter intenso y cuerpo marcado. Aromas frutales con una nota balsámica que recuerda al pino. En boca es estructurada, con sensaciones cálidas y un final firme y persistente."},"tags":["birra","forte","lager","corposa","fruttata","balsamica"],"photo":"bulldog-strong-lager","abv":"8,7%"},{"id":"lagunitas-ipa","group":"beers","name":{"it":"Lagunitas IPA"},"price":"3,50–6,00","desc":{"it":"Una Indian Pale Ale ben sviluppata, prevalentemente caratterizzata da un sapore agrumato (dato dai luppoli utilizzati, i classici C-Hop americani) e da un sapore di caramello (dato dal particolare malto utilizzato), che si bilanciano tra loro.","en":"A bold and well-balanced Imperial India Pale Ale brewed with classic American C-hop varieties. Bright citrus and tropical hop flavours are perfectly complemented by a rich caramel malt backbone, creating a beer that is intensely aromatic, full-bodied and exceptionally smooth despite its strength.","de":"Imperial IPA mit intensiven Zitrus- und Hopfenaromen, unterstützt von einer leichten Karamellmalzbasis. Kräftig und aromatisch im Charakter.","es":"Indian Pale Ale americana de gran intensidad aromática. Destacan los lúpulos cítricos típicos de la costa oeste, equilibrados con notas de caramelo provenientes de la malta. Una cerveza potente pero muy bien balanceada."},"tags":["birra","ipa","amara","agrumata","luppolata","forte","caramello"],"photo":"lagunitas-ipa","abv":"6,2%"},{"id":"coca-cola","group":"soft","name":{"it":"Coca-Cola"},"price":"2,50","desc":{},"tags":["cola","bibita","analcolico","dolce"],"photo":"coca-cola"},{"id":"7-up","group":"soft","name":{"it":"7 Up"},"price":"2,50","desc":{},"tags":["limone","bibita","analcolico","fresco"],"photo":"7-up"},{"id":"oransoda","group":"soft","name":{"it":"Oransoda"},"price":"2,50","desc":{},"tags":["arancia","bibita","analcolico","fruttato"],"photo":"oransoda"},{"id":"lemonsoda","group":"soft","name":{"it":"Lemonsoda"},"price":"2,50","desc":{},"tags":["limone","bibita","analcolico","agrumato"],"photo":"lemonsoda"},{"id":"te-pesca-limone","group":"soft","name":{"it":"Tè pesca / limone","en":"Peach / lemon iced tea","de":"Pfirsich- / Zitronen-Eistee","es":"Té helado melocotón / limón"},"price":"2,50","desc":{},"tags":["te","pesca","limone","analcolico","fresco"],"photo":"te-pesca-limone"},{"id":"schweppes-tonica","group":"soft","name":{"it":"Schweppes Tonica","en":"Schweppes Tonic Water","de":"Schweppes Tonic Water","es":"Schweppes Tónica"},"price":"2,50","desc":{},"tags":["tonica","amara","analcolico"],"photo":"schweppes-tonica"},{"id":"pepsi","group":"soft","name":{"it":"Pepsi"},"price":"2,50–4,50","desc":{},"tags":["cola","bibita","analcolico"],"photo":"pepsi"},{"id":"pepsi-max","group":"soft","name":{"it":"Pepsi Max"},"price":"2,50","desc":{},"tags":["cola","bibita","analcolico"],"photo":"pepsi-max"},{"id":"succo-di-frutta","group":"soft","name":{"it":"Succo di frutta","en":"Fruit juice — ask our staff","de":"Saft — Personal fragen","es":"Zumo — consulte al   let ix=0;function tryNext(){if(ix>=urls.length){image.dataset.loaded='missing';return;}const src=urls[ix++];const test=new Image();test.onload=()=>{image.src=src;image.style.display='block';placeholder.style.display='none';image.dataset.loaded='yes';};test.onerror=tryNext;test.src=src;}tryNext();
 });
}
function goHome(){active=null;expanded.clear();render();}
document.addEventListener('click',e=>{
 const cat=e.target.closest('[data-cat]');if(cat){active=cat.dataset.cat;query='';expanded.clear();render();return;}
 const home=e.target.closest('[data-home]');if(home){goHome();return;}
 const toggle=e.target.closest('[data-toggle]');if(toggle){const id=toggle.dataset.toggle;expanded.has(id)?expanded.delete(id):expanded.add(id);const item=toggle.closest('.item');if(item){item.classList.toggle('open',expanded.has(id));toggle.setAttribute('aria-expanded',expanded.has(id));hydratePhotos(item.parentNode);}return;}
 const suggestion=e.target.closest('[data-suggest]');if(suggestion){query=suggestion.dataset.suggest;expanded.clear();const input=$('search');if(input)input.value=query;$('homeContent').innerHTML=results(query);$('clearSearch').hidden=false;return;}
 if(e.target.closest('#clearSearch')){query='';expanded.clear();$('search').value='';$('clearSearch').hidden=true;$('homeContent').innerHTML=categories();$('search').focus();}
});
document.addEventListener('input',e=>{
 if(e.target.id!=='search')return;query=e.target.value;expanded.clear();$('clearSearch').hidden=!query;$('homeContent').innerHTML=query.trim()?results(query):categories();
});
$('language').addEventListener('change',e=>{lang=e.target.value;expanded.clear();render(false);});
$('homeBrand').addEventListener('click',e=>{e.preventDefault();query='';goHome();});
render();
</script></body></html>
